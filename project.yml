name: WardenBio
options:
  bundleIdPrefix: tech.xvanturing
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: T8F5T6HKG8
    CODE_SIGN_IDENTITY: "Apple Development"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # 公证的硬性要求：app 和内嵌的 BioHost 都必须开 hardened runtime，
    # 否则 notarytool 返回 Invalid（"The executable does not have the
    # hardened runtime enabled."）。钥匙串和 Touch ID 在 hardened runtime
    # 下正常工作，不需要额外的 com.apple.security.cs.* entitlement。
    ENABLE_HARDENED_RUNTIME: YES
targets:
  WardenBio:
    type: application
    platform: macOS
    sources:
      # AppIcon.svg 只是图标的源文件，由 scripts/make-icon.sh 光栅化成
      # Resources/Assets.xcassets/AppIcon.appiconset，不需要进 app bundle
      - path: Sources/App
        excludes:
          - "Resources/AppIcon.svg"
      - Sources/Protocol
      - Sources/Shared
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: BioHost
        # codeSign（CodeSignOnCopy）必须开：不开的话拷进 Contents/MacOS 的那份
        # 会在 app 签名时被重签成 flags=0x0，hardened runtime 标志丢失，公证被拒。
        codeSign: true
        copy:
          destination: executables
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: WardenBio
        CFBundleDisplayName: WardenBio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "2"
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: ""
  BioHost:
    type: tool
    platform: macOS
    sources:
      - Sources/BioHost
      - Sources/Protocol
      - Sources/Shared
    settings:
      base:
        # BioHost 已经通过 WardenBio 的 dependencies.copy 内嵌进 app bundle。
        # 不加这条的话归档里还会多出 Products/usr/local/bin/BioHost，Xcode 会
        # 因为拿不准该分发哪个产物而不写 ApplicationProperties，
        # 随后 -exportArchive 就报 'method ... expected one {}'。
        SKIP_INSTALL: YES
  ProtocolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/Protocol
      - Sources/Shared
      - Tests/ProtocolTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WardenBio:
    build:
      targets:
        WardenBio: all
        ProtocolTests: [test]
    test:
      targets: [ProtocolTests]
