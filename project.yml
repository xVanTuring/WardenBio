name: WardenBio
options:
  bundleIdPrefix: com.xvan
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: T8F5T6HKG8
    CODE_SIGN_IDENTITY: "Apple Development"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  WardenBio:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/Protocol
      - Sources/Shared
    dependencies:
      - target: BioHost
        copy:
          destination: executables
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: WardenBio
        CFBundleDisplayName: WardenBio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSHumanReadableCopyright: ""
  BioHost:
    type: tool
    platform: macOS
    sources:
      - Sources/BioHost
      - Sources/Protocol
      - Sources/Shared
  ProtocolTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/Protocol
      - Sources/Shared
      - Tests/ProtocolTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WardenBio:
    build:
      targets:
        WardenBio: all
        ProtocolTests: [test]
    test:
      targets: [ProtocolTests]
