<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    WardenBio 应用图标：深色圆角底 + 盾牌（Bitwarden 蓝）+ 指纹（Touch ID）。
    改完这个文件跑 scripts/make-icon.sh 重新生成 appiconset。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#2B3A5C"/>
      <stop offset="0.5" stop-color="#16203A"/>
      <stop offset="1"   stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="shine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shield" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0"   stop-color="#4A8CFF"/>
      <stop offset="0.5" stop-color="#175DDC"/>
      <stop offset="1"   stop-color="#0E3FA0"/>
    </linearGradient>
    <linearGradient id="shieldShine" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shieldShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="0" dy="20"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#shine)"/>

  <g filter="url(#shieldShadow)">
    <path fill="url(#shield)"
          d="M306 236 H718 A28 28 0 0 1 746 264 V512 C746 650 652 744 512 806 C372 744 278 650 278 512 V264 A28 28 0 0 1 306 236 Z"/>
    <path fill="url(#shieldShine)"
          d="M306 236 H718 A28 28 0 0 1 746 264 V420 C660 372 580 352 512 352 C444 352 364 372 278 420 V264 A28 28 0 0 1 306 236 Z"/>
  </g>

  <!-- 指纹脊线：椭圆脊线，四条收口高度各不相同，底部留口 -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-opacity="0.95">
    <path stroke-width="26" d="M369.2 561.6 A152 180 0 1 1 654.8 561.6"/>
    <path stroke-width="26" d="M418.6 578.0 A114 136 0 1 1 605.4 578.0"/>
    <path stroke-width="26" d="M438.6 523.8 A76 92 0 1 1 587.7 508.0"/>
    <path stroke-width="24" d="M487.6 535.2 A38 46 0 1 1 536.4 535.2"/>
  </g>
</svg>
